# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512M -XX:ReservedCodeCacheSize=512M

# Gradle
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=768M -XX:ReservedCodeCacheSize=512M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Android
# AndroidX is needed explicitly by KMP
android.useAndroidX=true

# atomicfu: use the compiler IR transformation so atomic usages are rewritten
# for all JVM-based targets (including Android), avoiding a runtime dependency
# on kotlinx.atomicfu classes that aren't packaged into the APK.
kotlinx.atomicfu.enableJvmIrTransformation=true

# Ktor
development=true
