ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = ["se.gustavkarlsson.chefgpt.ApplicationKt.module"]
    }
}

bindings {
    storage = "database" # or "memory"
    storage = ${?STORAGE}
    recipes = "spoonacular" # or "fake"
    recipes = ${?RECIPES}
    agent = "llm" # or "fake"
    agent = ${?AGENT}
    files = "cloudinary" # or "fake"
    files = ${?FILES}
}

ai {
    providers {
        anthropic {
            apiKey = ${?ANTHROPIC_API_KEY}
        }
        deepseek {
            apiKey = ${?DEEPSEEK_API_KEY}
        }
    }
    agents {
        chat {
            provider = "anthropic"
            model = "claude-sonnet-4-6"
            model = ${?CHAT_MODEL}
        }
        ingredientScan {
            provider = "anthropic"
            model = "claude-sonnet-4-6"
            model = ${?INGREDIENT_SCAN_MODEL}
        }
        recipeScan {
            provider = "anthropic"
            model = "claude-sonnet-4-6"
            model = ${?RECIPE_SCAN_MODEL}
        }
        describeImage {
            provider = "anthropic"
            model = "claude-haiku-4-5"
            model = ${?DESCRIBE_IMAGE_MODEL}
        }
    }
}

spoonacular {
    apiKey = ${?SPOONACULAR_API_KEY}
}

cloudinary {
    apiKey = ${?CLOUDINARY_API_KEY}
    apiSecret = ${?CLOUDINARY_API_SECRET}
    cloud = ${?CLOUDINARY_CLOUD}
}

logging {
    calls {
        request {
            headers = false
        }
        response {
            headers = false
        }
    }
}

postgres {
    host = ${?POSTGRES_HOST}
    port = ${?POSTGRES_PORT}
    database = ${?POSTGRES_DATABASE}
    username = ${?POSTGRES_USERNAME}
    password = ${?POSTGRES_PASSWORD}
}

include file("application_dev.conf")
